<!doctype html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Job details — Kairos</title><link rel="icon" href="/assets/images/favicon.ico" /><link rel="stylesheet" href="/css/style.css" /></head><body data-page="landing"><header class="site-nav container"><a class="brand-mark" href="/"><img src="/assets/images/kairos-logo.png" alt="Kairos" /></a><div class="nav-actions"><a class="button button-outline" href="/pages/companies.html">← Jobs</a></div></header><main class="container section"><p class="eyebrow">Job details</p><section class="panel" style="max-width:900px"><div id="job-detail" class="empty-state"><strong>Loading jobs…</strong></div></section></main><script src="/js/api.js"></script><script>(async function(){const box=document.getElementById('job-detail');const id=new URLSearchParams(location.search).get('id');if(!id){box.innerHTML='<strong>No job selected</strong>Browse available jobs in the directory.';return;}if(!window.KairosAPI.getAccessToken()){location.href='/pages/login.html?next='+encodeURIComponent(location.pathname+location.search);return;}const e=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));try{const rows=await window.KairosAPI.apiFetch(window.KairosAPI.API.companies.jobs);const job=Array.isArray(rows)?rows.find(row=>String(row.id)===id):null;if(!job){box.className='empty-state';box.innerHTML='<strong>Job unavailable</strong>This job is not among the current open listings.';return;}box.className='';box.innerHTML=`<h1 style="font-size:clamp(2.5rem,5vw,5rem)">${e(job.title)}</h1>${job.description?`<p class="hero-lede">${e(job.description)}</p>`:''}<p>Status: ${e(job.status||'Not specified')}</p>${job.budget!=null?`<p>Budget: ₹${e(job.budget)}</p>`:''}`;}catch(error){box.className='empty-state';box.textContent='Unable to load job: '+error.message;}})();</script></body></html>
