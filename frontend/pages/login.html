<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Log in to Kairos and keep your career momentum moving." />
    <title>Log in — Kairos</title>
    <link rel="icon" href="/assets/images/favicon.ico" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body data-page="login">
    <main class="auth-page">
      <section class="auth-brand-panel"><a class="brand-mark" href="/"><img src="/assets/images/kairos-logo.png" alt="Kairos — Learn, Build, Get Hired" /></a><div class="auth-brand-copy"><p class="eyebrow">Welcome back</p><h1>Keep your<br /><em>momentum.</em></h1><p>Your path is already in motion. Pick up where you left off.</p></div></section>
      <section class="auth-form-panel"><div class="auth-form-wrap"><a class="brand-mark" href="/"><img src="/assets/images/kairos-logo.png" alt="Kairos — Learn, Build, Get Hired" /></a><p class="eyebrow">Kairos workspace</p><h2>Log in</h2><p>Enter your details to continue your journey.</p><form id="login-form" class="field-stack"><div class="auth-error" role="alert"></div><div class="form-field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required /></div><div class="form-field"><label for="password">Password</label><div style="position:relative"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required style="padding-right:65px" /><button class="password-toggle" data-target="password" type="button" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--color-turquoise);font-size:.68rem">Show</button></div></div><div class="form-helper"><label class="checkbox-label"><input type="checkbox" name="remember" checked /> Remember me</label><a href="#" class="panel-link" onclick="event.preventDefault();">Forgot password?</a></div><button class="button button-gold auth-submit" type="submit">Log in <span>↗</span></button></form><p class="auth-switch">New to Kairos? <a href="/pages/register.html">Create an account</a></p></div></section>
    </main>
    <div id="toast-region" class="toast-region" aria-live="polite"></div>
    <script src="/js/api.js"></script><script src="/js/app.js"></script>
  </body>
</html>
