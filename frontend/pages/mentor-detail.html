<!doctype html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Mentor — Kairos</title><link rel="icon" href="/assets/images/favicon.ico" /><link rel="stylesheet" href="/css/style.css" /></head><body data-page="landing"><header class="site-nav container"><a class="brand-mark" href="/"><img src="/assets/images/kairos-logo.png" alt="Kairos" /></a><div class="nav-actions"><a class="button button-outline" href="/pages/mentors.html">← Mentors</a></div></header><main class="container section"><p class="eyebrow">Mentor profile</p><section class="panel" style="max-width:820px"><div id="mentor-detail" class="empty-state"><strong>Loading mentor…</strong></div></section></main><div id="toast-region" class="toast-region" aria-live="polite"></div><script src="/js/api.js"></script><script>(async function(){const box=document.getElementById('mentor-detail');const id=new URLSearchParams(location.search).get('id');if(!id){box.innerHTML='<strong>No mentor selected</strong>Select a mentor in the directory.';return;}if(!window.KairosAPI.getAccessToken()){location.href='/pages/login.html?next='+encodeURIComponent(location.pathname+location.search);return;}const e=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));try{const m=await window.KairosAPI.apiFetch(window.KairosAPI.API.mentors.detail(id));box.className='';box.innerHTML=`<h1 style="font-size:clamp(2.5rem,5vw,5rem)">${e(m.domain||'Mentor')}</h1><p>${m.is_available?'Available for bookings':'Currently unavailable'}</p>${m.experience_years!=null?`<p>Experience: ${e(m.experience_years)} years</p>`:''}${m.rating!=null?`<p>Rating: ${e(m.rating)}</p>`:''}<p>Mentor ID: ${e(m.id)}</p>`;}catch(error){box.className='empty-state';box.textContent='Unable to load mentor: '+error.message;}})();</script></body></html>
