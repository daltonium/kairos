<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create your Kairos account and start building your next chapter." />
    <title>Create account — Kairos</title>
    <link rel="icon" href="/assets/images/favicon.ico" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body data-page="register">
    <main class="auth-page">
      <section class="auth-brand-panel"><a class="brand-mark" href="/"><img src="/assets/images/kairos-logo.png" alt="Kairos — Learn, Build, Get Hired" /></a><div class="auth-brand-copy"><p class="eyebrow">A better next step</p><h1>Make your<br /><em>timing count.</em></h1><p>Build skills you can show, find people who can help, and get closer to the work you want.</p></div></section>
      <section class="auth-form-panel"><div class="auth-form-wrap"><a class="brand-mark" href="/"><img src="/assets/images/kairos-logo.png" alt="Kairos — Learn, Build, Get Hired" /></a><p class="eyebrow">Join Kairos</p><h2>Create account</h2><p>Choose your path. You can grow from there.</p><form id="register-form" class="field-stack"><div class="auth-error" role="alert"></div><div class="form-grid"><div class="form-field full"><label for="full_name">Full name</label><input id="full_name" name="full_name" autocomplete="name" placeholder="Your full name" required /></div><div class="form-field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" placeholder="your-handle" minlength="3" required /></div><div class="form-field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required /></div><div class="form-field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" placeholder="8+ characters" minlength="8" required /></div><div class="form-field"><label for="confirm_password">Confirm password</label><input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" placeholder="Repeat password" minlength="8" required /></div></div><div class="form-field"><label>How will you use Kairos?</label><div class="role-select"><label><input type="radio" name="role" value="student" checked /><span>Student</span></label><label><input type="radio" name="role" value="mentor" /><span>Mentor</span></label><label><input type="radio" name="role" value="company" /><span>Company</span></label></div></div><label class="checkbox-label" style="color:var(--color-muted);font-size:.7rem"><input type="checkbox" required /> I agree to use Kairos with intention.</label><button class="button button-gold auth-submit" type="submit">Create account <span>↗</span></button></form><p class="auth-switch">Already have an account? <a href="/pages/login.html">Log in</a></p></div></section>
    </main>
    <div id="toast-region" class="toast-region" aria-live="polite"></div>
    <script src="/js/api.js"></script><script src="/js/app.js"></script>
  </body>
</html>
